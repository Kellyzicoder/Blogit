      <h2 class="text-primary">Change Password</h2>
      <form action="homepage.html" method="get">
        <input type="hidden" name="password" value="password" />


        <div class="input-field">
          <input type="password" placeholder="Enter current password" class="password " name="currentpassword" required>
			<i class="uil uil-lock icon"></i> <i class="uil uil-eye-slash showHidePw"></i> </div>

			<div class="input-field">
          <input type="password" placeholder="Confirm new password" class="password " name="confirmnewpassword" required>
          <i class="uil uil-lock icon"></i> <i class="uil uil-eye-slash showHidePw"></i> </div>

		  
        <div class="input-field button">
          <input type="submit" name="updatepassword" value="Update Password">
